name: mediacored-windows

on:
  push:
    tags: ["core-v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --bin mediacored
        working-directory: core/mediacore
      - run: cargo test --release
        working-directory: core/mediacore
      - uses: actions/upload-artifact@v4
        with:
          name: mediacored-windows-x64
          path: core/mediacore/target/release/mediacored.exe
      # On tag pushes, also attach the exe to a GitHub release so the
      # Windows repo can pin a stable download URL.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/core-v')
        with:
          files: core/mediacore/target/release/mediacored.exe
