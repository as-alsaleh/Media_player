[package]
name = "mediacore"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Network + metadata core for MediaPlayer: SMB client, loopback streamer, indexer"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
thiserror = "1"
tracing = "0.1"
smb = { version = "0.11", features = ["async"] }
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
futures-util = "0.3.33"
tokio-stream = "0.1.19"
tracing-subscriber = "0.3.23"
rusqlite = { version = "0.40.1", features = ["bundled"] }
regex = "1.13.1"
serde_json = "1.0.151"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uniffi = { version = "0.32.0", features = ["cli"] }
# SMB client — evaluate pure-Rust `smb` vs wrapping libsmb2; see docs/smb-client.md
# uniffi = "0.28"   # enable when wiring the Swift FFI (M1 step 3)

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
